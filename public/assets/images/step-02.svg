<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <!-- Soft backdrop -->
  <rect x="20" y="20" width="200" height="160" rx="20" fill="#F0F8FF"/>
  <circle cx="120" cy="100" r="60" fill="#5CAAEA" fill-opacity="0.15"/>

  <!-- Smartwatch strap -->
  <rect x="106" y="32" width="28" height="136" rx="6" fill="#1E293B"/>
  <!-- Watch body -->
  <rect x="94" y="65" width="52" height="68" rx="16" fill="#0F172A" stroke="#5CAAEA" stroke-width="2"/>
  <!-- Watch screen -->
  <rect x="100" y="72" width="40" height="54" rx="10" fill="#1E293B"/>
  
  <!-- Screen ECG wave & stats -->
  <path d="M104 100H112L116 90L121 112L126 94L130 102H136" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="120" cy="82" r="3" fill="#5CAAEA"/>
  <text x="120" y="120" font-family="sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">74 BPM</text>

  <!-- Wireless / Bluetooth sync waves -->
  <path d="M160 85C168 93 168 107 160 115" stroke="#5CAAEA" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M170 78C182 90 182 110 170 122" stroke="#5CAAEA" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M80 85C72 93 72 107 80 115" stroke="#5CAAEA" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M70 78C58 90 58 110 70 122" stroke="#5CAAEA" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Sparkles / connection dots -->
  <circle cx="65" cy="50" r="4" fill="#5CAAEA"/>
  <circle cx="180" cy="55" r="5" fill="#2DD4BF"/>
</svg>
