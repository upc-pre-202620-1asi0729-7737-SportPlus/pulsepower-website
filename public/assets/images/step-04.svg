  <!-- Calendar card -->
  <rect x="75" y="45" width="90" height="100" rx="14" fill="#FFFFFF" stroke="#2DD4BF" stroke-width="2" filter="drop-shadow(0 6px 12px rgba(45, 212, 191, 0.15))"/>
