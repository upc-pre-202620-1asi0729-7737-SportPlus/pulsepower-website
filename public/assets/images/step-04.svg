  <rect x="108" y="118" width="47" height="14" rx="4" fill="#FEF3C7"/>
  <text x="131" y="128" font-family="sans-serif" font-size="7" font-weight="600" fill="#92400E" text-anchor="middle">Sleep Prep</text>

  <!-- Clock badge -->
  <circle cx="168" cy="140" r="18" fill="#101B35" stroke="#2DD4BF" stroke-width="2"/>
