  <path d="M75 59C75 51.268 81.268 45 89 45H151C158.732 45 165 51.268 165 59V68H75V59Z" fill="#2DD4BF"/>
  <circle cx="95" cy="56" r="3" fill="#FFFFFF"/>
  <circle cx="145" cy="56" r="3" fill="#FFFFFF"/>

  <!-- Calendar rows -->
  <rect x="85" y="78" width="18" height="14" rx="4" fill="#E6FFFA"/>
  <text x="94" y="88" font-family="sans-serif" font-size="7" font-weight="700" fill="#0D9488" text-anchor="middle">08:00</text>
  <rect x="108" y="78" width="47" height="14" rx="4" fill="#CCFBF1"/>
  <text x="131" y="88" font-family="sans-serif" font-size="7" font-weight="600" fill="#134E4A" text-anchor="middle">HIIT Workout</text>

  <rect x="85" y="98" width="18" height="14" rx="4" fill="#E6FFFA"/>
  <text x="94" y="108" font-family="sans-serif" font-size="7" font-weight="700" fill="#0D9488" text-anchor="middle">13:30</text>
