<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <!-- Soft backdrop -->
  <rect x="20" y="20" width="200" height="160" rx="20" fill="#FFFBEB"/>
  <circle cx="120" cy="100" r="60" fill="#EDB55E" fill-opacity="0.15"/>

  <!-- Analytics card -->
  <rect x="65" y="45" width="110" height="110" rx="16" fill="#FFFFFF" stroke="#EDB55E" stroke-width="2" filter="drop-shadow(0 6px 12px rgba(237, 181, 94, 0.2))"/>

  <!-- Bar charts -->
  <rect x="80" y="115" width="14" height="25" rx="4" fill="#EDB55E" fill-opacity="0.4"/>
  <rect x="100" y="100" width="14" height="40" rx="4" fill="#EDB55E" fill-opacity="0.6"/>
  <rect x="120" y="85" width="14" height="55" rx="4" fill="#EDB55E" fill-opacity="0.8"/>
  <rect x="140" y="68" width="14" height="72" rx="4" fill="#EDB55E"/>

  <!-- Upwards Trend line with points -->
  <path d="M87 110L107 95L127 80L147 62" stroke="#101B35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="87" cy="110" r="3.5" fill="#FFFFFF" stroke="#101B35" stroke-width="2"/>
  <circle cx="107" cy="95" r="3.5" fill="#FFFFFF" stroke="#101B35" stroke-width="2"/>
  <circle cx="127" cy="80" r="3.5" fill="#FFFFFF" stroke="#101B35" stroke-width="2"/>
  <circle cx="147" cy="62" r="4.5" fill="#2DD4BF" stroke="#101B35" stroke-width="2"/>

  <!-- Growth badge -->
  <rect x="135" y="36" width="48" height="20" rx="10" fill="#101B35"/>
  <text x="159" y="49" font-family="sans-serif" font-size="9" font-weight="700" fill="#2DD4BF" text-anchor="middle">+32%</text>

  <!-- Sparkle / star -->
  <path d="M55 70L58 78L66 81L58 84L55 92L52 84L44 81L52 78Z" fill="#EDB55E"/>
</svg>
